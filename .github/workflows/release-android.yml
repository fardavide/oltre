name: Release Android

# Merging to `main` publishes. That is already true of iOS — Xcode Cloud archives every `main`
# commit and ships it to TestFlight — and this is the Android half of the same contract: the
# changelog entry and the version have to be right *before* a pull request goes green, because
# the release happens the moment it merges.
#
# The trigger is a push to `main` that touches the version catalogue, which is the only file the
# `oltre` version lives in. That makes the job cheap and its condition exact, but not precise:
# bumping Ktor touches the same file. So the first thing it does is ask whether this version is
# already released, and stop if it is. Nothing here is destructive on a second run.
on:
  push:
    branches: [main]
    paths: ['gradle/libs.versions.toml']
  workflow_dispatch:

# To create the release and the tag it hangs on. Nothing else.
permissions:
  contents: write

# Never two publishes at once, and never cancel one half way: a cancelled run can leave a tag
# with no release on it, which the "already published?" check below would then read as done.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    name: Publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The script decides every string the release wears, and a published release cannot be
      # un-published — so its tests run before it does, in the job that depends on the answer.
      # They also run on every pull request, in the Coverage job, which is where a mistake
      # should be caught; this is the second line.
      - name: Test the release script
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest .github/scripts -q

      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          python3 .github/scripts/android_release.py plan \
            --catalog gradle/libs.versions.toml \
            --readme README.md \
            --commit "${GITHUB_SHA:0:7}" \
            --body-out "$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"

      # Idempotence, and the whole reason the catalogue-path trigger is allowed to be imprecise.
      - name: Check whether this version is already published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already published — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Before the build rather than after it, so a missing secret costs seconds instead of a
      # full Gradle run. The signing config in `androidApp/build.gradle.kts` falls back to an
      # unsigned release when these are absent — which is right for `assemble` on a fork's pull
      # request, and wrong for anything that gets published.
      - name: Check the signing key is configured
        if: steps.published.outputs.already == 'false'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}."
            echo "::error::An unsigned APK, or one signed with a throwaway key, will not install"
            echo "::error::over the previous release — see .claude/docs/decisions.md."
            exit 1
          fi

      - uses: actions/setup-java@v5
        if: steps.published.outputs.already == 'false'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.published.outputs.already == 'false'

      # Into the runner's temp directory, never the workspace: a keystore inside the checkout is
      # one `git add -A` away from being committed to a public repository.
      - name: Decode the keystore
        if: steps.published.outputs.already == 'false'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/oltre.keystore"

      - name: Build the release APK
        if: steps.published.outputs.already == 'false'
        env:
          OLTRE_KEYSTORE_FILE: ${{ runner.temp }}/oltre.keystore
          OLTRE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OLTRE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OLTRE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease

      # Found rather than named, and checked rather than assumed. AGP writes
      # `androidApp-release-unsigned.apk` when it has no signing config, so a build that silently
      # lost its key produces a differently named file — and the one thing this job must never do
      # is publish an APK that cannot install over the last one.
      - name: Name the APK after the version
        id: apk
        if: steps.published.outputs.already == 'false'
        env:
          ASSET: ${{ steps.plan.outputs.asset }}
        run: |
          set -euo pipefail
          mapfile -t built < <(find androidApp/build/outputs/apk/release -name '*.apk' | sort)
          if [ ${#built[@]} -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#built[@]}: ${built[*]}"
            exit 1
          fi
          case "${built[0]}" in
            *-unsigned.apk)
              echo "::error::${built[0]} is unsigned — the signing config did not take."
              exit 1
              ;;
          esac
          cp "${built[0]}" "$RUNNER_TEMP/$ASSET"
          echo "path=$RUNNER_TEMP/$ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.published.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          # Creates the tag on this commit as well, so the version is tagged by whatever
          # published it rather than by hand afterwards.
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/release-body.md"
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "Published [$TITLE]($url)." >> "$GITHUB_STEP_SUMMARY"

      - name: Shred the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/oltre.keystore"
