name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JVM & Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assemble

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check

  screenshot:
    name: Screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyRoborazziDesktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: roborazzi-diffs
          path: '**/build/outputs/roborazzi/'

  # Reports, does not gate. Kept out of the required checks on purpose: five Gradle passes is
  # the slowest job here, and a number nobody has agreed on yet has no business blocking a
  # merge. When Davide picks thresholds, `koverVerify` is where they go.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # The delta's other half. Only `main` writes a baseline, so the most recent cache matching
      # the prefix is always the last green `main` run — a PR branch can read the default
      # branch's caches, which is what makes this work without a token or an external service.
      # Restored before the measurement, and outside `build/`, which the measurement wipes.
      - name: Restore the main coverage baseline
        uses: actions/cache/restore@v4
        with:
          path: .coverage-baseline
          key: oltre-coverage-v1-${{ github.sha }}
          restore-keys: oltre-coverage-v1-

      - name: Measure coverage per test category
        run: .github/scripts/measure-coverage.sh

      - name: Render the report
        run: |
          python3 .github/scripts/coverage.py render \
            --current build/coverage/summary.json \
            --baseline .coverage-baseline/summary.json \
            --out build/coverage/comment.md

      - name: Publish to the run summary
        run: cat build/coverage/comment.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, rewritten in place: the PR should show where coverage *is*, not a
      # transcript of every push. A fork PR gets a read-only token and cannot comment — the run
      # summary above still carries the report, so this is a soft failure.
      - name: Comment the report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('build/coverage/comment.md', 'utf8');
            const marker = '<!-- oltre-coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Store this run as the new baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .coverage-baseline
          cp build/coverage/summary.json .coverage-baseline/summary.json
      - name: Save the baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .coverage-baseline
          key: oltre-coverage-v1-${{ github.sha }}

  ios:
    name: iOS framework
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :client:shell:linkDebugFrameworkIosSimulatorArm64
