name: Record screenshots

# **This runner is Linux and the gate is a Mac, so what this job commits will fail CI.** Since
# 2026-08-21 `oltreRoborazziOptions()` allows zero changed pixels and the screenshot job verifies on
# macOS, and a Linux render differs from a Mac one on 5–7.5% of the pixels of nearly every frame.
# Dispatching this is therefore a commitment to re-recording those frames on a Mac afterwards — it
# is the escape hatch for a machine that cannot build, not the way to update a baseline. On a Mac,
# `./gradlew recordRoborazziDesktop` takes about a minute and shows you the same before/after.
#
# Manual only, on purpose. Recording is the one thing CI must never do by itself: a job that
# re-records on every red build turns the screenshot test into a recorder of whatever the code
# happens to draw. Triggering this by hand is the human decision "the visual change is intended";
# the comment it posts is where that decision gets checked.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose branch should be re-recorded
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  record:
    name: Record screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the pull request branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=$(gh pr view "${{ inputs.pr }}" --json headRefName --jq .headRefName)
          git checkout "$branch"
          {
            echo "BRANCH=$branch"
            echo "BEFORE_SHA=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # `--rerun-tasks`, and it is load-bearing rather than belt-and-braces.
      #
      # **Recording writes into `src/*/screenshots`, which is a source directory and not a task
      # output**, so Gradle's up-to-date and cache checks do not model what this job exists to do.
      # A `desktopTest` served FROM-CACHE reports success and writes no PNG at all, and the commit
      # step then finds a clean tree and says "screenshots already match" — the one sentence this
      # job must never say wrongly.
      #
      # Measured at 0.5.1, which is why this line exists: a first dispatch failed in one module,
      # a second dispatch after the fix replayed the *other* modules from the first run's cache,
      # and the research baselines were left showing a requirement string the app no longer
      # produces while the job reported success. Re-running everything costs this manual job a few
      # minutes; getting it wrong costs a baseline that asserts a screen nobody can reach.
      #
      # **Know what this widens.** The committed baselines are macOS-recorded — `oltreRoborazziOptions`
      # says so and exists to absorb the difference — so every module this job *executes* comes back
      # re-rendered on Linux, whether its content changed or not. The cache was accidentally limiting
      # that blast radius; without it, one dispatch converts every frame it touches. 0.5.1 saw 32
      # baselines rewritten where 26 had a reason to move, and the 22 belonging to modules the change
      # did not touch were reverted by hand before merge.
      #
      # So: **read the job's comment and revert the frames whose content did not change.** The right
      # long-term fix is a commit step that drops any PNG whose diff sits inside the verifier's own
      # tolerance, which would make this job self-limiting; it is not built, and it is Davide's call.
      - run: ./gradlew recordRoborazziDesktop --rerun-tasks

      - name: Commit the re-recorded baselines
        id: record
        run: |
          set -euo pipefail
          git status --porcelain -- '*.png' | sed 's/^...//' > /tmp/touched.txt
          if [ ! -s /tmp/touched.txt ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -a /tmp/touched.txt git add --
          git commit -m "chore: re-record screenshot baselines"
          git push origin "$BRANCH"
          echo "after_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload Roborazzi's own diff renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-recorded
          path: '**/build/outputs/roborazzi/'
          if-no-files-found: ignore

      - name: Comment with the before and after
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER_SHA: ${{ steps.record.outputs.after_sha }}
          CHANGED: ${{ steps.record.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # raw.githubusercontent.com serves the image itself; the github.com/.../raw/... form is
          # a redirect, and a comment's image proxy is happier with the direct URL.
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}"
          {
            if [ "$CHANGED" != "true" ]; then
              echo "### Screenshots already match"
              echo
              echo "\`recordRoborazziDesktop\` produced no changes — every committed baseline is"
              echo "what the code currently draws. Nothing was pushed."
            else
              echo "### Screenshot baselines re-recorded"
              echo
              echo "Recorded on this run and pushed to \`${BRANCH}\`. **Check the images before merging**"
              echo "— this job replaced the assertion, so from here CI can only tell you that the UI"
              echo "still draws what it drew in this run."
              echo
              echo "| Baseline | Before | After |"
              echo "|---|---|---|"
              while read -r file; do
                name=$(basename "$file")
                if git cat-file -e "${BEFORE_SHA}:${file}" 2>/dev/null; then
                  before="<img src=\"${raw}/${BEFORE_SHA}/${file}\" width=\"260\">"
                else
                  before="_new baseline_"
                fi
                echo "| \`${name}\` | ${before} | <img src=\"${raw}/${AFTER_SHA}/${file}\" width=\"260\"> |"
              done < /tmp/touched.txt
              echo
              echo "GitHub's own image diff (2-up, swipe, onion-skin) is under **Files changed** on"
              echo "the \`chore: re-record screenshot baselines\` commit. Roborazzi's diff renders are"
              echo "attached to [this run](${RUN_URL}) as \`roborazzi-recorded\`."
            fi
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/comment.md
          gh pr comment "${{ inputs.pr }}" --body-file /tmp/comment.md

      # A push made with GITHUB_TOKEN does not start a workflow run, so the new head commit would
      # otherwise sit with no checks at all — which the protect-main ruleset reads as unmergeable
      # rather than as green. Dispatching CI explicitly puts the four required checks on it.
      - name: Re-run CI against the new commit
        if: steps.record.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$BRANCH"
