name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JVM & Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assemble

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # **Tags, because one test measures against what was actually published.**
      # `ReleaseCatalogueIntegrationTest` asserts every `v<version>` tag has a changelog page — the
      # one check in that file that does not take the README as its source, and therefore the only
      # one that notices a release being deleted from the record entirely. A checkout fetches no
      # tags by default, so without this the test sees an empty list; it fails rather than passes in
      # that state, deliberately, so the omission cannot go quiet.
      #
      # **`fetch-depth: 0` rather than `fetch-tags: true`, and that is measured rather than
      # preferred.** The first cut asked for `fetch-tags` and the job failed on exactly the guard
      # above: the action logged `fetch-tags: true` and then ran
      # `git fetch --prune --no-recurse-submodules --depth=1 origin +<sha>:refs/remotes/pull/119/merge`
      # — no `--tags` anywhere, so not one tag reached the runner. Full history is unambiguous, and
      # it costs a 62 MiB pack of 86 commits against a job that already runs for six minutes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check

  # **The one job that does not run on Linux, and the reason is the whole point of it.** A
  # screenshot test asserts that a drawing has not moved; it can only do that if the machine that
  # records and the machine that verifies draw the same thing. Recording happens on a Mac, so this
  # verifies on a Mac.
  #
  # It used to verify on Linux, and the cost of that was not the odd red build — it was the loop it
  # forced. A locally recorded baseline could fail CI for a reason no diff explained, so a visual
  # change went out through the manual "Record screenshots" job instead: dispatch, wait for a
  # runner, take its commit, re-dispatch CI. **PR #92 spent 38 workflow runs in one day that way**
  # (30 CI, 8 record dispatches).
  #
  # Measured across the whole corpus on 2026-08-21 rather than from one CI artifact. Re-rendering
  # `main`'s committed baselines on a Mac reports **5–7.5% of pixels changed on nearly every one of
  # the 102 frames**, with `facility_sheet_locked` (9.4%) and `research_sheet_inert_slide_over`
  # (8.7%) — the two carrying the most wrapped prose — spilling past the 8% budget outright. So the
  # drift was pervasive and the budget was a tight fit around it, not slack left over from a fixed
  # problem.
  #
  # Those two spilling over are what made a local record unusable: it produced a corpus that failed
  # here, which taught every session to dispatch the manual job instead of recording on the machine
  # already in front of it.
  #
  # The difference is the two operating systems and nothing else — two consecutive
  # `recordRoborazziDesktop` runs on the same Mac produced **byte-identical output for all 102
  # frames**. One OS at both ends leaves nothing to budget for, which is what lets
  # `oltreRoborazziOptions()` hold `ThresholdValidator(0f)`.
  #
  # macOS runners are free on a public repo. If that ever stops being true, the fallback is a
  # measured per-frame tolerance on Linux, not a return to an 8% blanket.
  screenshot:
    name: Screenshot tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyRoborazziDesktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: roborazzi-diffs
          path: '**/build/outputs/roborazzi/'

  # Reports *and* gates. The rule is a plain ratchet with no floor and no slack: every line and
  # branch number in the per-kind table must hold at or above the last `main` run. Required
  # check: five Gradle passes make this the slowest job here, but it runs alongside
  # `iOS framework`, which is just as slow, so gating on it costs nothing on the critical path.
  # The comparison lives in `coverage.py` (`gate_checks`).
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Tags for the same reason the Unit tests job takes them — and by the same means, which that
      # job's comment explains: this one runs the whole suite five times over,
      # `ReleaseCatalogueIntegrationTest` included.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # The delta's other half. Only `main` writes a baseline, so the most recent cache matching
      # the prefix is always the last green `main` run — a PR branch can read the default
      # branch's caches, which is what makes this work without a token or an external service.
      # Restored before the measurement, and outside `build/`, which the measurement wipes.
      - name: Restore the main coverage baseline
        uses: actions/cache/restore@v4
        with:
          path: .coverage-baseline
          key: oltre-coverage-v1-${{ github.sha }}
          restore-keys: oltre-coverage-v1-

      # The gate's arithmetic decides whether a PR can merge, so it is verified by the job that
      # enforces it — before it is enforced, and cheaply enough that it never justifies skipping.
      - name: Test the coverage script
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest .github/scripts -q

      - name: Measure coverage per test category
        run: .github/scripts/measure-coverage.sh

      # **So a disputed number can be looked at rather than reasoned about.** The five passes
      # overwrite one `report.xml`, and until PR #104 nothing survived the job — a screenshot row
      # that came out a point low could not be explained from the outside at all. `if: always()`,
      # because the run worth inspecting is the one that failed.
      - name: Keep the per-category Kover reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: build/coverage/
          if-no-files-found: warn

      - name: Render the report
        run: |
          python3 .github/scripts/coverage.py render \
            --current build/coverage/summary.json \
            --baseline .coverage-baseline/summary.json \
            --out build/coverage/comment.md \
            --verdict-out build/coverage/verdict.json

      - name: Publish to the run summary
        run: cat build/coverage/comment.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, rewritten in place: the PR should show where coverage *is*, not a
      # transcript of every push. A fork PR gets a read-only token and cannot comment — the run
      # summary above still carries the report, so this is a soft failure.
      - name: Comment the report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('build/coverage/comment.md', 'utf8');
            const marker = '<!-- oltre-coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Store this run as the new baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .coverage-baseline
          cp build/coverage/summary.json .coverage-baseline/summary.json
      - name: Save the baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .coverage-baseline
          key: oltre-coverage-v1-${{ github.sha }}

      # Last, so a blocked PR already carries the comment that explains why. Pull requests only:
      # on a `main` push the merge has happened and the gate can prevent nothing, and turning
      # `main` red for a number no revert-free action can fix is a false alarm, not a signal.
      # The baseline above is stored first for the same reason — `main` must keep tracking
      # reality, or every later PR is measured against a number `main` no longer has.
      - name: Enforce the coverage gate
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/coverage.py enforce --verdict build/coverage/verdict.json

  ios:
    name: iOS framework
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :client:shell:linkDebugFrameworkIosSimulatorArm64

      # **`:protocol` is reached by nothing yet, so without this line its Apple half is checked by
      # no job on this workflow.** The link task above compiles the shell's whole dependency
      # closure, which is what covers `core` — but nothing depends on `:protocol` until
      # `:client:net:data` lands in #112, and the three Linux jobs cannot compile for Apple at all.
      # A module whose whole purpose is to be read at both ends would then have one end unbuilt.
      #
      # **The test source set and not only `commonMain`**, which is the whole point: the trap #107
      # warns about by name is a *compiler* rule, and it only applies to tests. Kotlin/Native rejects
      # a backticked name containing `, . ; : / \ < > [ ]` where the JVM accepts it happily, so a
      # comma in `protocol/src/commonTest` passes the entire local suite and takes CI down.
      #
      # A compile task rather than `iosSimulatorArm64Test`, deliberately. What this job can uniquely
      # provide is the Native **compiler**; the assertions themselves already run on the JVM in the
      # `Unit tests` job, so executing them a second time on a simulator buys a booted device's worth
      # of flakiness for a second opinion on the same `assertEquals`. `./gradlew :protocol:build`
      # runs them on Native locally, which is where that check belongs.
      #
      # Comes off this list the day the shell's closure reaches the module.
      - run: ./gradlew :protocol:compileTestKotlinIosSimulatorArm64

      # **`:client:net:data` is in exactly `:protocol`'s position, one slice later**, and for the
      # same reason: #112 lands the module and #113 is what puts it in the shell's closure, so until
      # then nothing on this workflow compiles its Apple half. That half is not incidental — it is
      # where the Darwin engine lives, which is the one file in the module no machine in this
      # repository can run.
      #
      # **One line covers both new modules.** `:client:net:data`'s `commonTest` depends on
      # `:client:net:data-testing`, so compiling the test source set for this target compiles the
      # fake's Apple half too. `-testing`'s own test source set holds nothing.
      #
      # The test source set and not only `commonMain`, for the reason spelled out above: the
      # backtick trap is a compiler rule that applies only to tests.
      #
      # Comes off this list when #113 lands, together with the line above it.
      - run: ./gradlew :client:net:data:compileTestKotlinIosSimulatorArm64
